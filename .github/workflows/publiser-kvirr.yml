name: Publiser Kvirr-nettsiden

# Pusher kun de ferdige filene fra kvirr/ til det offentlige repoet hlundstad/kvirr
# som én ny rotløs commit (force-push), så det offentlige repoet ikke samler historikk.
on:
  push:
    branches: [main]
    paths:
      - "kvirr/**"
      - ".github/workflows/publiser-kvirr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publiser-kvirr
  cancel-in-progress: true

jobs:
  publiser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hent kilden (kun siste commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Publiser til hlundstad/kvirr
        env:
          DEPLOY_TOKEN: ${{ secrets.KVIRR_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_TOKEN}" ]; then
            echo "::error::Secret KVIRR_DEPLOY_TOKEN mangler"
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/ut"
          mkdir "$RUNNER_TEMP/ut"
          cp -r kvirr/. "$RUNNER_TEMP/ut/"
          touch "$RUNNER_TEMP/ut/.nojekyll"
          cd "$RUNNER_TEMP/ut"
          git init -q -b main
          git config user.name "Kvirr"
          git config user.email "noreply@users.noreply.github.com"
          git add -A
          git commit -q -m "Publiser"
          git remote add origin "https://x-access-token:${DEPLOY_TOKEN}@github.com/hlundstad/kvirr.git"
          git push --force origin main
